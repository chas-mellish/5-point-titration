[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anaerobic-digester-titration"
version = "0.1.0"
description = "5-point titration analysis for anaerobic digester water chemistry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "matplotlib>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]              # Changed from src/tests/
python_files = ["test_*.py"]
addopts = "-v --cov=src/titration --cov-report=html"

[tool.coverage.run]
source = ["src/titration"]
