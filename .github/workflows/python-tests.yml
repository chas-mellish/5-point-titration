name: Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ".[dev]"
# Add this AFTER "pip install -e '.[dev]'" step:
    - name: Add src to Python path
      run: |
        echo "PYTHONPATH=src:$PYTHONPATH" >> $GITHUB_ENV

# Temporarily disable coverage to see if tests work
    - name: Run tests with pytest
      run: |
        pytest tests/ -v

#    - name: Run tests with pytest
#      run: |
#        pytest tests/ -v --cov=src/titration --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
